# Configuración por defecto del Ejecutor programático del Bloque A Forex (V1.0)
# Bloque A Forex · Robot Investor · Versión óptima V1.0 · 02/11/2026 · subordinado al Documento 0 del Bloque A Forex V1.0
# (seis segmentos de divisas de 2.6, 21 agentes, presupuestos del Anexo A Forex, referencias de 8.4).
# Cualquier clave puede sobrescribirse con un YAML propio (--config) que se fusiona sobre este.

modo: vivo                 # vivo | backtest  (el comando «backtest» fuerza «backtest»)
zona_horaria: Europe/Madrid
idioma: es-ES
methodology_version: "FX-1.1"   # V1.1 (03/11/2026): Anexo A del Documento 0 Forex V1.1
divisa_base_usuario: EUR   # Anexo A (servicio): divisa en que ahorra el usuario (termómetro del informe visual)
segmentos_activos: [G10N, G10M, EMAS, EMLA, EMEA, ESTR]

rutas:
  # Raíz del paquete del Bloque A Forex (carpetas 01_…10_). null = autodetección (carpeta padre de 11_Ejecutor)
  # o variable de entorno BLOQUE_A_FOREX_RAIZ.
  raiz_paquete: null
  prompts: 02_System_prompts
  plantillas: 06_Plantillas_entregables
  archivos_operativos: 05_Archivos_operativos
  # Estado del bloque (F1–F6, F10, RC, HA en JSONL) y entregables del modo vivo
  almacen: ./estado_bloque_a_forex
  entregables: ./entregables

# Carga de prompts: cada agente se busca en «prompts» por el prefijo «System prompt - <nombre del agente>» con
# cualquier sufijo de versión; se prefiere el del Bloque A Forex («… - Bloque A Forex - Versión óptima V1.0.md»).
prompts:
  # Si falta el prompt de un Analista de segmento o transversal, se usa el «Marco común de los Analistas de segmento
  # (plantilla)» y se registra una incidencia (modo degradado). false = error si falta.
  marco_comun_si_falta: true

# ---------------------------------------------------------------------------
# Modelos por agente. IMPORTANTE: los identificadores deben comprobarse en la
# documentación de Anthropic (página de modelos) antes de usar el cliente real.
# ---------------------------------------------------------------------------
modelos:
  por_defecto: claude-sonnet-5-5
  AG-01: claude-haiku-5-5     # Coordinador de Peticiones y Consultas
  AG-02: claude-opus-5-5      # Analizador de Oportunidades en Divisas
  AG-03: claude-sonnet-5-5    # Analista de G10 núcleo (G10N)
  AG-04: claude-sonnet-5-5    # Analista de G10 de materias primas y escandinavas (G10M)
  AG-05: claude-sonnet-5-5    # Analista de Divisas Emergentes de Asia (EMAS)
  AG-06: claude-sonnet-5-5    # Analista de Divisas Emergentes de Latinoamérica (EMLA)
  AG-07: claude-sonnet-5-5    # Analista de Divisas Emergentes de EMEA (EMEA)
  AG-08: claude-sonnet-5-5    # Analista de Estrategias y Cestas Cambiarias (ESTR)
  AG-09: claude-sonnet-5-5    # Analista de Bancos Centrales y Macro Cambiaria (transversal, BCM)
  AG-10: claude-sonnet-5-5    # Analista de Prospectiva y Horizontes
  AG-11: claude-opus-5-5      # Analista de hipótesis contrarias
  AG-12: claude-haiku-5-5     # Curador de Evidencia
  AG-13: claude-sonnet-5-5    # Motor de Cálculo Avanzado (Forex) (solo planificación no estándar)
  AG-14: claude-sonnet-5-5    # Documentador para el Analizador
  AG-15: claude-sonnet-5-5    # Documentador para el Motor de Cálculo Avanzado
  AG-16: claude-sonnet-5-5    # Buscador de Fuentes Avanzadas
  AG-17: claude-sonnet-5-5    # Redactor y Diseñador de Informes
  AG-18: claude-sonnet-5-5    # Orquestador técnico
  AG-19: claude-sonnet-5-5    # Auditor
  AG-20: claude-opus-5-5      # Evaluador de Previsiones y Aprendizaje
  AG-21: claude-sonnet-5-5    # Analista de Posicionamiento, Flujos y Volatilidad Cambiaria (transversal, PFV)

max_tokens:
  por_defecto: 8000
  AG-03: 12000
  AG-04: 12000
  AG-05: 12000
  AG-06: 12000
  AG-07: 12000
  AG-08: 12000
  AG-09: 10000
  AG-21: 10000
  AG-10: 10000
  AG-11: 10000
  AG-17: 10000

llm:
  max_reintentos_api: 4          # reintentos del SDK ante 429/5xx/conexión
  timeout_s: 600
  cache_prompts: true            # cache_control en el system prompt (caché de prompts)
  cache_ttl: "1h"                # 5m | 1h
  salida_estructurada: false     # true = output_config.format json_schema (comprobar soporte del modelo)
  reintento_reparacion: 1        # reintentos de reparación de JSON no conforme
  max_continuaciones_pause_turn: 3
  cache_resultados: true         # HT-06: misma petición → misma respuesta desde caché
  semilla_mock: 20261102

busqueda_web:
  habilitada_en_vivo: true       # en backtest siempre desactivada (fuga de información)
  tipo_herramienta: web_search_20260318
  max_usos_por_llamada: 5
  agentes: [AG-14, AG-15, AG-16]

# ---------------------------------------------------------------------------
# Presupuestos (Anexo A del Documento 0 Forex) y conversión a UC
# ---------------------------------------------------------------------------
presupuesto_uc:
  N0: 1
  N1: 5          # por segmento
  N2: 18         # por segmento
  N3: 50         # por petición
  transversal: 6 # por informe transversal (AG-09 y AG-21) y ciclo
  ciclo_semanal_max: 140   # ciclo semanal completo: seis segmentos y dos informes transversales
  ampliacion_sin_autorizacion: 0.25
  ampliacion_max_autorizable: 0.50
  reparto_fases:                # fracción del presupuesto del segmento
    cribado: 0.35
    investigacion: 0.20
    prospectiva: 0.15
    refutacion: 0.20
    respuesta_objeciones: 0.10
  rotacion_exploratoria: 0.20

uc:
  # 1 UC ≈ 8 000 tokens de entrada y 1 500 de salida (Anexo A). Decisión del ejecutor:
  # UC_llamada = 0,5·(entrada_equivalente/8000) + 0,5·(salida/1500), con
  # entrada_equivalente = entrada_no_cacheada + escritura_cache + factor_lectura_cache·lectura_cache.
  tokens_entrada_por_uc: 8000
  tokens_salida_por_uc: 1500
  factor_lectura_cache: 0.1
  # Cálculos deterministas del Motor (sin modelo de lenguaje)
  motor_por_plan: {PLAN_MIN: 0.02, PLAN_STD: 0.1, PLAN_EXT: 0.5}

# Precios por millón de tokens (USD) para estimar el coste. SIN VALORES: rellénelos con la
# tarifa vigente publicada por Anthropic. Mientras sean null, consumo.csv deja el coste vacío.
precios_por_millon:
  claude-opus-5-5: {entrada: null, salida: null, escritura_cache: null, lectura_cache: null}
  claude-sonnet-5-5: {entrada: null, salida: null, escritura_cache: null, lectura_cache: null}
  claude-haiku-5-5: {entrada: null, salida: null, escritura_cache: null, lectura_cache: null}
precio_busqueda_web_por_mil: null

# ---------------------------------------------------------------------------
# Horizontes, referencias y parámetros de análisis
# ---------------------------------------------------------------------------
horizontes:            # H1 días (1–10 sesiones) · H2 semanas (2–8) · H3 meses (3–12) · H4 años (1–5): punto de resolución
  H1: {sesiones: 5}
  H2: {semanas: 4}
  H3: {meses: 6}
  H4: {meses: 12}
horizonte_principal_preferente: [H3, H2, H4, H1]

# Referencias de comparación (8.4 y Anexo A; propuesta inicial, a ratificar por el operador en F10). Todo pronóstico
# se evalúa frente al paseo aleatorio (sin cambio; probabilidad 0,5) y, cuando procede, frente al forward como predictor.
# Para la rentabilidad total relativa del top-3: NINGUNA = rentabilidad en exceso nula (posición neutra en liquidez de
# la divisa base del usuario); CESTA = cesta equiponderada de las divisas emergentes del segmento frente al USD, con carry.
indices_referencia:
  G10N: NINGUNA
  G10M: NINGUNA
  EMAS: CESTA
  EMLA: CESTA
  EMEA: CESTA
  ESTR: NINGUNA   # rentabilidad nula (los índices de estrategia del ejemplo ya son de exceso de rentabilidad)

# Fijación de los datos HT-01 del proveedor CSV (hora y zona; G3-FX-07). Ajústela a su fuente real.
ht01:
  hora_fijacion: "17:00 America/New_York"

gc0:
  # Anexo A (1): una opción vigente o finalista, o el índice representativo del segmento, se mueve > 1,5 σ semanales,
  # o lo hace al menos un tercio de los pares vigilados del segmento. (2) Cambio de tipos de un banco central del
  # segmento (series TIPO-<ISO>). Sorpresas macro e intervenciones: eventos_calendario.
  sigma_semanal: 1.5
  indice_representativo:      # 8.4: dólar amplio en G10N; sin código, cesta equiponderada de los indicadores del segmento
    G10N: DOLAR-AMPLIO
  invalidacion_cercana: 0.10  # invalidación a < 10 % de activarse: queda < 10 % del recorrido entre el nivel de alta y el umbral
  ventana_sigma_semanas: 104
  eventos_calendario: []       # [{fecha: AAAA-MM-DD, segmentos: [G10N], evento: "Intervención del Ministerio de Finanzas de Japón"}]

seleccion:
  max_candidatas: 8
  max_finalistas: 5
  umbral_senal_gc1: 0.75
  peticiones_conocimiento_por_segmento: 1

auditoria:
  en_vivo: true
  en_backtest: false
  muestreo_ad_hoc: 0.30

evaluacion:
  min_calibrar: 30
  min_certificar: 100
  ece_max: 0.15
  bootstrap_replicas: 2000
  simulaciones_ece: 2000
  nivel_ic: 0.90
  aplicar_recalibracion: false   # false = modo sombra: se registra y se compara, no se aplica
  dias_habiles_no_resoluble: 10
  llm_informe_aprendizaje: true

# Paralelismo de agentes sin estado (R25)
paralelismo:
  hilos_analistas: 4
  umbral_cola: 3

backtest:
  frecuencia: semanal          # semanal | quincenal | mensual | diaria
  dia_semana: 4                # 0 = lunes … 4 = viernes (fecha as_of: cierre de Nueva York del viernes)
  resolver_al_final: true      # tras el último ciclo, resolver con los datos disponibles
  # Fecha de corte de conocimiento del modelo (valor orientativo: compruébelo en la
  # documentación de Anthropic). Un periodo anterior genera advertencia de fuga por conocimiento.
  fecha_corte_modelo: "2026-06-30"
  anonimizar: false
