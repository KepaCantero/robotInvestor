[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloque_a"
version = "1.1.0"
description = "Ejecutor programático del Bloque A (Robot Investor) para pruebas y backtesting"
requires-python = ">=3.12"   # T-113 (H-55 de T-104): cuantificadores posesivos (3.11) y `redaccion.py` (3.12)
dependencies = ["anthropic>=2.0", "jsonschema>=4.18", "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "PyYAML>=6.0"]

[project.optional-dependencies]
garch = ["arch>=6.0"]
yahoo = ["yfinance>=0.2"]
pruebas = ["pytest>=8"]

[project.scripts]
bloque-a = "bloque_a.cli:main"

[tool.setuptools]
packages = ["bloque_a", "bloque_a.motor", "bloque_a.herramientas", "bloque_a.herramientas.referencia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
