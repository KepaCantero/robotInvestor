# Configuración por defecto del Ejecutor programático del Bloque A (V1.1)
# Bloque A · Robot Investor · Versión óptima V5.0 · 02/11/2026 · actualizado V5.1 (03/11/2026) · subordinado al Documento 0 óptima V5.1
# (doce tipos de activo de 2.6, presupuestos del Anexo A, referencias de 8.4, Analistas AG-03..AG-09 y AG-21..AG-25).
# Cualquier clave puede sobrescribirse con un YAML propio (--config) que se fusiona sobre este.

modo: vivo                 # vivo | backtest  (el comando «backtest» fuerza «backtest»)
zona_horaria: Europe/Madrid
idioma: es-ES

# [PROPUESTO] PA-01 (T-66). Tipos de activo con perfil activo. En la Fase 1, solo divisas; el resto se activa cuando
# tenga datos y fichas propias (D-17). Pregunta del cuestionario (T-57): «¿En qué tipos de inversión quieres que el robot
# busque oportunidades? (Recomendado ahora: solo divisas)». Valores: RV RF DIV MP IDX FON DER INM CRI ALT MON TCV
perfiles:
  activos: [DIV]

# [PROPUESTO] PA-05 (T-66). Veredicto de Contrarias por regla (CT-G-03): «frágil» si una objeción fuerte se resolvió en
# contrarréplica o hay al menos este número de moderadas. Efecto de «frágil»: confianza «especulativo» (INC-T66-01).
# Técnico, sin pregunta del cuestionario.
contrarias:
  moderadas_para_fragil: 2
methodology_version: "5.1"

rutas:
  # Raíz del paquete del Bloque A (carpetas 01_…10_). null = autodetección (carpeta padre de 11_Ejecutor)
  # o variable de entorno BLOQUE_A_RAIZ.
  raiz_paquete: null
  prompts: 02_System_prompts
  plantillas: 06_Plantillas_entregables
  archivos_operativos: 05_Archivos_operativos
  # Estado del bloque (F1–F6, F10, RC, HA en JSONL) y entregables del modo vivo
  almacen: ./estado_bloque_a
  entregables: ./entregables

# Carga de prompts: cada agente se busca en «prompts» por el nombre de su agente con cualquier sufijo de versión
# («System prompt - <nombre> - Versión óptima V5.0.md», «… V5.0.md», …; se toma la versión más alta).
prompts:
  # Si falta el prompt específico de un Analista de tipo de activo, se usa el «Marco común de los Analistas de
  # tipo de activo (plantilla)» y se registra una incidencia (modo degradado). false = error si falta.
  marco_comun_si_falta: true

# ---------------------------------------------------------------------------
# T-101 · Diseño del Bloque A. «v5»: los 25 agentes de la entrega V5.1 (referencia, por defecto). «v6»: el rediseño
# aspirante (.docs/diseno/bloque_a/decision_claude_c01.md): Analista de perfil con núcleo común y kit, GC1 por código,
# Prospectiva una vez por ciclo, Contradictor solo de la selección provisional y sus sustitutas, Sintetizador, Lector
# de evidencia, Respondedor de consultas y curación, dictamen G3 e informe de aprendizaje por código. Se cambia a «v6»
# cuando el banco con la API real (modo sombra, Fase 5) lo respalde; cada pieza tiene su interruptor para medirla sola.
# Los números marcados [PROPUESTO] van a la sesión de decisiones del operador (T-57).
# ---------------------------------------------------------------------------
diseno: v5
v6:
  prompts_dir: prompts_v6            # prompts nuevos de la V6 (relativa a 11_Ejecutor; fuera del corpus congelado)
  analista:
    nucleo_y_kit: true               # false = el prompt V5.0 íntegro de cada Analista
    base_conocimientos: ninguna      # ninguna | completa: la §10 del prompt V5.0 entra o no en el kit (la compara el banco)
  gc1:
    por_codigo: true                 # el código filtra el universo antes del Analista (PA-04)
    senal_por_perfil: {}             # tipo de activo -> clave de señal del Motor que manda en GC1 (por defecto senal_compuesta)
    exploracion_celdas: 2            # [PROPUESTO] ámbitos que no pasan GC1 y llegan igualmente, marcados (falsos negativos)
  prospectiva:
    global: true                     # una llamada por ciclo (en lotes) en vez de una por tipo de activo
    max_encargos_por_lote: 12        # [PROPUESTO] A-02 de la revisión C-01: el lote escala por candidatas
    lotes_por_perfil: false          # true = un lote por tipo de activo (para que el banco lo compare)
  contradictor:
    solo_seleccion: true             # A-01: solo la selección provisional y sus sustitutas
    max_rondas_sustitucion: 2        # [PROPUESTO] rondas de crítica de sustitutas; lo que quede sin crítica no se entrega
    proveedor: mismo                 # mismo | otro (decisión 2 de la tanda 1; sin contratar: se usa el mismo y se declara)
    max_evidencias: 6                # técnico: evidencias por opción que ve el Contradictor (el mismo 6 de la V5)
    contrarreplica_max: 300          # técnico: caracteres que se guardan del motivo de una contrarréplica (el mismo 300 de la V5)
  sintetizador: true                 # integración y textos en una llamada, después de G3 (sustituye a AG-02 y AG-17)
  lector_evidencia: true             # CT-07 y CT-08 en el ciclo (sustituye a AG-14 y AG-16 en el ciclo)
  respondedor: true                  # consultas N0 de CT-03 (sustituye a la parte de IA de AG-01)
  curacion_llm: false                # true = AG-12 clasifica las piezas (ablación PA-14)
  dictamen_g3_llm: false             # true = AG-18 dictamina las advertencias de HT-09
  informe_aprendizaje_llm: false     # true = AG-20 redacta el informe CT-19 (las lecciones deterministas siguen)
  auditoria_fraccion: 0.25           # [PROPUESTO] fracción de runs vivos que audita AG-19 (muestreo sembrado por run)
  cobertura:
    registrar: true                  # A-05 e idea 3: registro del embudo por candidata en HA
    muestra_descartes: 2             # [PROPUESTO] descartes por tipo y run con seguimiento contrafactual (idea 4)
    horizonte_contrafactual: H3      # [PROPUESTO] horizonte con el que se resuelve la muestra
    dias_max_espera_precio: 30       # [PROPUESTO] días tras el vencimiento que se espera a tener precios; después, NO_RESOLUBLE
  # [PROPUESTO] idea 7: tope de tokens (aproximados) del system prompt por papel; la prueba de T-101 lo vigila
  tope_tokens_system: {analista: 14000, AG-10: 23000, AG-11: 20000, AG-26: 2500, AG-27: 1800, AG-28: 1800}
  # Técnico (QA r01 de T-101, H-08): longitud máxima en caracteres de los textos que se toman del Sintetizador, longitud
  # mínima de un texto útil y cuántas preguntas y limitaciones suyas entran como mucho
  sintetizador_limites: {regimen: 900, factor: 300, lectura: 1200, texto_minimo: 5, preguntas: 6, limitaciones: 5, limitacion: 300}
  # QA r02 de T-101, H-12: códigos en mayúsculas que pueden aparecer junto a «comprar» o «vender» sin ser un instrumento concreto
  # (R21): divisas, tipos de activo y siglas de segmentos; además valen los símbolos del universo. Técnico, ampliable.
  filtro_r21_codigos: [USD, EUR, JPY, GBP, CHF, CAD, AUD, NZD, SEK, NOK, DKK, MXN, BRL, CNY, CNH, INR, KRW, ZAR, TRY, PLN, HUF, CZK,
                       RV, RF, DIV, MP, IDX, FON, DER, INM, CRI, ALT, MON, TCV, EM, HY, IG, ETF, REIT, VIX, MOVE, PIB, IPC, BCE, FED,
                       OPEP, TIPS, EE, UU, UE, MSCI, DXY, WTI, BRENT, GNL, GLP, ISM, PMI, S&P, NASDAQ, DAX, IBEX, CAC, FTSE,
                       NIKKEI, STOXX, BTC, ETH, XAU, XAG, LME, CPI, PCE, EBITDA, BPA, OPA, IPO, BCE, BOJ, BOE, SNB, PBOC]

# ---------------------------------------------------------------------------
# Modelos por agente. IMPORTANTE: los identificadores deben comprobarse en la
# documentación de Anthropic (página de modelos) antes de usar el cliente real.
# ---------------------------------------------------------------------------
modelos:
  por_defecto: claude-sonnet-5-5
  AG-01: claude-haiku-5-5     # Coordinador de Peticiones y Consultas
  AG-02: claude-opus-5-5      # Analizador de Tendencias de Inversión
  AG-03: claude-sonnet-5-5    # Analista de Renta Variable (RV)
  AG-04: claude-sonnet-5-5    # Analista de Renta Fija (RF)
  AG-05: claude-sonnet-5-5    # Analista de Divisas (DIV)
  AG-06: claude-sonnet-5-5    # Analista de Materias Primas (MP)
  AG-07: claude-sonnet-5-5    # Analista de Activos Inmobiliarios Cotizados (INM)
  AG-08: claude-sonnet-5-5    # Analista de Criptoactivos y Activos Digitales (CRI)
  AG-09: claude-sonnet-5-5    # Analista de Capital Privado y Activos Alternativos (ALT)
  AG-10: claude-sonnet-5-5    # Analista de Prospectiva y Horizontes
  AG-11: claude-opus-5-5      # Analista de hipótesis contrarias
  AG-12: claude-haiku-5-5     # Curador de Evidencia
  AG-13: claude-sonnet-5-5    # Motor de Cálculo Avanzado (solo planificación no estándar)
  AG-14: claude-sonnet-5-5    # Documentador para el Analizador
  AG-15: claude-sonnet-5-5    # Documentador para el Motor
  AG-16: claude-sonnet-5-5    # Buscador de Fuentes Avanzadas
  AG-17: claude-sonnet-5-5    # Redactor y Diseñador de Informes
  AG-18: claude-sonnet-5-5    # Orquestador técnico
  AG-19: claude-sonnet-5-5    # Auditor
  AG-20: claude-opus-5-5      # Evaluador de Previsiones y Aprendizaje
  AG-21: claude-sonnet-5-5    # Analista de Índices Bursátiles (IDX)
  AG-22: claude-sonnet-5-5    # Analista de Fondos y Vehículos de Inversión Colectiva (FON)
  AG-23: claude-sonnet-5-5    # Analista de Derivados Financieros (DER)
  AG-24: claude-sonnet-5-5    # Analista de Instrumentos Monetarios y Liquidez (MON)
  AG-25: claude-sonnet-5-5    # Analista de Tipos de Interés, Crédito y Volatilidad (TCV)
  AG-26: claude-sonnet-5-5    # V6 · Sintetizador (integración y textos)
  AG-27: claude-haiku-5-5     # V6 · Respondedor de consultas N0
  AG-28: claude-haiku-5-5     # V6 · Lector de evidencia (aislado)

max_tokens:
  por_defecto: 8000
  AG-02: 8000
  AG-03: 12000
  AG-04: 12000
  AG-05: 12000
  AG-06: 12000
  AG-07: 12000
  AG-08: 12000
  AG-09: 12000
  AG-21: 12000
  AG-22: 12000
  AG-23: 12000
  AG-24: 12000
  AG-25: 12000
  AG-10: 10000
  AG-11: 10000
  AG-17: 10000

llm:
  max_reintentos_api: 4          # reintentos del SDK ante 429/5xx/conexión
  timeout_s: 600
  cache_prompts: true            # cache_control en el system prompt (caché de prompts)
  cache_ttl: "1h"                # 5m | 1h
  salida_estructurada: false     # true = output_config.format json_schema (comprobar soporte del modelo)
  reintento_reparacion: 1        # reintentos de reparación de JSON no conforme
  max_continuaciones_pause_turn: 3
  cache_resultados: true         # HT-06: misma petición → misma respuesta desde caché
  semilla_mock: 20261102

busqueda_web:
  habilitada_en_vivo: true       # en backtest siempre desactivada (fuga de información)
  tipo_herramienta: web_search_20260318
  max_usos_por_llamada: 5
  agentes: [AG-14, AG-15, AG-16, AG-28]   # AG-28: Lector de evidencia de la V6 (T-101)

# ---------------------------------------------------------------------------
# Presupuestos (Anexo A del Documento 0 óptima V5.0) y conversión a UC
# ---------------------------------------------------------------------------
presupuesto_uc:
  N0: 1
  N1: 5          # por tipo de activo
  N2: 18         # por tipo de activo
  N3: 50         # por petición
  ciclo_semanal_max: 240   # ciclo semanal completo con los doce tipos
  ampliacion_sin_autorizacion: 0.25
  ampliacion_max_autorizable: 0.50
  reparto_fases:                # fracción del presupuesto del tipo de activo
    cribado: 0.35
    investigacion: 0.20
    prospectiva: 0.15
    refutacion: 0.20
    respuesta_objeciones: 0.10
  rotacion_exploratoria: 0.20
  # [PROPUESTO] técnico (QA r01 de T-65, H-05): suelo de la bolsa COMÚN como fracción del ciclo semanal (antes, 0,1 en el código)
  fraccion_minima_comun: 0.1

uc:
  # 1 UC ≈ 8 000 tokens de entrada y 1 500 de salida (Anexo A). Decisión del ejecutor:
  # UC_llamada = 0,5·(entrada_equivalente/8000) + 0,5·(salida/1500), con
  # entrada_equivalente = entrada_no_cacheada + escritura_cache + factor_lectura_cache·lectura_cache.
  tokens_entrada_por_uc: 8000
  tokens_salida_por_uc: 1500
  factor_lectura_cache: 0.1
  # Cálculos deterministas del Motor (sin modelo de lenguaje)
  motor_por_plan: {PLAN_MIN: 0.02, PLAN_STD: 0.1, PLAN_EXT: 0.5}

# Precios por millón de tokens (USD) para estimar el coste. SIN VALORES: rellénelos con la
# tarifa vigente publicada por Anthropic. Mientras sean null, consumo.csv deja el coste vacío.
precios_por_millon:
  claude-opus-5-5: {entrada: null, salida: null, escritura_cache: null, lectura_cache: null}
  claude-sonnet-5-5: {entrada: null, salida: null, escritura_cache: null, lectura_cache: null}
  claude-haiku-5-5: {entrada: null, salida: null, escritura_cache: null, lectura_cache: null}
precio_busqueda_web_por_mil: null

# ---------------------------------------------------------------------------
# Horizontes, referencias y parámetros de análisis
# ---------------------------------------------------------------------------
horizontes:
  H1: {sesiones: 5}
  H2: {semanas: 4}
  H3: {meses: 6}
  H4: {meses: 12}
  H5: {meses: 120}            # V5.1: décadas (5–30 años); se evalúa por sus hitos HIT-
horizonte_principal_preferente: [H3, H2, H4, H1, H5]
# T-65 (CA-14 de T-53) · Conversión de los horizontes a sesiones hábiles (tasa base RI-TB): convención de mercado, técnica.
# H2 4 semanas = 20 sesiones; H3 6 meses = 126; H4 12 meses = 252; H5 120 meses = 2520 (los mismos valores que antes).
calendario: {sesiones_por_semana: 5, sesiones_por_mes: 21}
# T-65 (CA-14 de T-53) · [PROPUESTO] técnico, sin pregunta del cuestionario. Tasa base RI-TB (referencia ingenua de cada
# pronóstico): ventanas no solapadas en los últimos `ventana_anios`; con menos de `min_ventanas`, la tasa neutra
# `sin_historia` (declarada como limitación en RC); siempre recortada a [recorte].
tasa_base: {ventana_anios: 3, min_ventanas: 5, sin_historia: 0.5, recorte: [0.05, 0.95]}

# Pronósticos H5 (Anexo A V5.1): solo banda verbal; ≥ 3 hitos; el primero a ≤ 12 meses; ≤ 24 meses entre hitos
h5:
  meses_hitos: [12, 30, 54]

# Seguimiento encargado de opción (CT-24, ciclo C6, F11; Anexo A V5.1)
seguimiento:
  frecuencias: {DIARIA: 1, SEMANAL: 7, QUINCENAL: 14, MENSUAL: 30, TRIMESTRAL: 91}   # días; PERSONALIZADA: calendario_personalizado.cada_dias
  frecuencia_orientativa_dias: {H1: 1, H2: 7, H3: 7, H4: 30, H5: 91}                  # aviso, no veto
  presupuesto_uc: {normal: 2, material: 5, sin_novedad: 0.5}
  ciclos_sin_novedad_para_proponer_cancelacion: 4
  umbral_rk_semaforo: 5          # variación de RK que pone el semáforo en VERDE (+) o ROJO (−)
  # T-65 (CA-14 de T-53): rendimientos semanales mínimos para estimar σ; con menos, el delta cuenta como material y se
  # declara (antes, un umbral inventado del 5 %). Técnico.
  min_semanas_sigma: 6

# Consultas del bloque al Broker (CT-23; Anexo A V5.1)
consultas_broker:
  plazo_horas: {BLOQUEANTE: 4, NO_BLOQUEANTE: 24}
  max_mensajes_por_run: 3
  recurrente: {repeticiones: 3, semanas: 8}

# Credenciales (CT-25; bóveda simulada de HT-01)
credenciales:
  respuesta_esperada_horas: 72
  recordatorio_dias: 7
  max_recordatorios: 3

# Referencias de comparación por tipo de activo (8.4; propuesta inicial, a ratificar por el operador en F10).
# Valores: símbolo HT-01 · CESTA (equiponderada de los indicadores del tipo en el universo) · SUBYACENTE (columna
# «subyacente» del universo para cada indicador; si falta, CESTA) · NINGUNA (pronóstico absoluto: posición neutra).
# Los símbolos del ejemplo son aproximaciones disponibles en el universo de ejemplo (ver README).
indices_referencia:
  RV: ACWI        # MSCI ACWI
  RF: AGG         # Bloomberg Global Aggregate cubierto a EUR (aproximación del ejemplo: agregado de EE. UU.)
  DIV: CESTA      # cesta equiponderada G10 frente a EUR (aproximación: cesta de pares del universo)
  MP: DBC         # Bloomberg Commodity Index (aproximación: cesta amplia de materias primas)
  IDX: ACWI       # MSCI ACWI
  FON: CESTA      # índice de la categoría del vehículo (aproximación: cesta de categorías del universo)
  DER: SUBYACENTE # rentabilidad del subyacente sin derivado
  INM: REET       # FTSE EPRA Nareit Developed (aproximación: REIT globales)
  CRI: BTC-USD    # bitcoin
  ALT: PSP        # LPX50, capital privado cotizado (aproximación)
  MON: XEON.DE    # €STR compuesto
  TCV: NINGUNA    # posición neutra (rentabilidad cero frente al índice de liquidez)

gc0:
  sigma_semanal: 1.5          # movimiento > 1,5 σ semanales del tipo de activo
  invalidacion_cercana: 0.10  # condición de invalidación a < 10 % de activarse
  ventana_sigma_semanas: 104
  eventos_calendario: []       # [{fecha: AAAA-MM-DD, clases: [RV], evento: "…"}]

seleccion:
  max_candidatas: 8
  max_finalistas: 5
  umbral_senal_gc1: 0.75
  peticiones_conocimiento_por_clase: 1
  # [PROPUESTO] T-65 (CS-10 de T-53) hasta T-57. Celdas del universo que se ofrecen en la rotación exploratoria de un ciclo
  # ligero (antes, un 2 en el código). El Anexo A (P-07) habla del 20 % del presupuesto de cribado; traducirlo a celdas
  # exige un coste por celda que no está en el Anexo A. Pregunta (T-57): «¿Cuánto se dedica a explorar ideas nuevas?»
  rotacion_exploratoria_celdas: 2
  # [PROPUESTO] INC-T53-05 (T-53; marcado en T-65, H-08 y H-09) hasta T-57. Prompt del Analizador (AG-02), 6.15.5 y 6.16:
  # semáforo y siguiente paso sugerido. El prompt solo da «E ≥ 70» para ENVIAR_A_BLOQUE_B; los 65 de A (VERDE y
  # PROFUNDIZAR_EN_A, «atractiva pero con incertidumbre reducible») no salen ni del prompt ni del Anexo A: los propone el
  # ejecutor. Pregunta (T-57): «¿Con qué solidez mínima (E) y atractivo mínimo (A) se propone enviar una opción al
  # Bloque B o seguir estudiándola?»
  semaforo: {E_verde: 70, A_verde: 65}            # VERDE con ≥ 1 opción de E ≥ 70 y A ≥ 65
  siguiente_paso: {E_enviar: 70, A_profundizar: 65}   # ENVIAR_A_BLOQUE_B exige E ≥ 70, sin objeción moderada abierta y catalizador en el horizonte

# [PROPUESTO] INC-T53-05 (T-65, CA-14 de T-53) hasta T-57. Presentación de cada opción: confianza «probable» con E ≥
# `confianza_probable_E` (si no, «especulativo») y zona de interés del minigráfico a ± `zona_interes` del precio.
presentacion: {confianza_probable_E: 70, zona_interes: 0.05}

# T-65 (H-08 de T-53) · Ventana de datos del lote de fichas del Motor por tipo de activo: `ventana_anios` hasta as_of más
# `margen_dias` (para cubrir la ventana de 3 años de las fichas). Técnico.
senales: {ventana_anios: 3, margen_dias: 30, umbral_favorable: 0.5}   # umbral_favorable [PROPUESTO] (T-92, H-09): una observación de HT-01 es favorable si la señal compuesta (0–1) llega a él

# Corroboración mínima (PS1, Anexo A, P-14; régimen Operador): raíces independientes A/B (o una fuente primaria A)
ps1: {raices_min: 2}

# Pregunta repetida (lección de producto, Anexo A, P-26; Calibrable): veces en las últimas semanas
pregunta_repetida: {veces: 3, semanas: 4}

# T-53 · Antigüedad máxima de los datos de mercado (Anexo A, PS2, P-13). [PROPUESTO] INC-T53-02 hasta T-57: H1 se cuenta en
# sesiones hábiles (el dato del viernes vale el lunes); el resto, en días naturales
ps2_antiguedad_maxima_dias: {H1: 1, H2: 3, H3: 7, H4: 30, H5: 90}
# [PROPUESTO] INC-T53-02 hasta T-57. Cierres habituales de mercado que no cuentan como sesión al medir la antigüedad en H1.
# Se validan al crear el Bloque (T-65, H-17): booleanos y lista de «MM-DD». `lunes_de_pascua` (nuevo en T-65) queda en
# false, como hasta ahora. Pregunta (T-57): «¿Qué días de cierre de mercado no cuentan como sesión?»
ps2_festivos: {viernes_santo: true, lunes_de_pascua: false, fijos: ['01-01', '12-24', '12-25', '12-26', '12-31']}

# [PROPUESTO] T-65 (QA r03, H-16) hasta T-57. Frescura de la referencia de comparación al emitir: si su último cierre
# válido tiene más de `antiguedad_maxima_dias` días naturales a la fecha as_of, la referencia no sirve y el tipo (o el
# indicador, con SUBYACENTE) no se analiza en ese ciclo, declarado. El Anexo A solo fija la antigüedad de PS2 por horizonte;
# 7 días es la de H3 y la misma tolerancia que ya usaba la resolución. Pregunta (T-57): «¿Con cuántos días de retraso
# deja de valer el índice con el que se compara una oportunidad?»
referencias: {antiguedad_maxima_dias: 7}

# T-53 · Clústeres de exposición (ML-CLUS-001; Catálogo del Motor): umbral de correlación y ventana. T-65 (CS-18): la
# ventana es la del Catálogo (≥ 3 años semanales) y fija también el inicio de los datos. El prompt del Analizador dice
# ρ ≥ 0,6: contradicción del corpus, para la revisión con el operador. [PROPUESTO] T-65 (H-16): un proxy con menos de
# `min_semanas_proxy` rendimientos semanales en la ventana se excluye del cálculo y se declara (clúster propio).
clusteres: {umbral_rho: 0.7, ventana_semanas: 156, min_semanas_proxy: 52}

# Legibilidad mínima del informe visual (Fernández-Huerta; control C12 de HT-09, Anexo A)
redaccion: {umbral_fh: 70}

auditoria:
  en_vivo: true
  en_backtest: false
  muestreo_ad_hoc: 0.30

evaluacion:
  min_calibrar: 30
  min_certificar: 100
  ece_max: 0.15
  bootstrap_replicas: 2000
  simulaciones_ece: 2000
  nivel_ic: 0.90
  aplicar_recalibracion: false   # false = modo sombra: se registra y se compara, no se aplica
  dias_habiles_no_resoluble: 10
  # T-65 (QA r03, H-16; QA r04, H-24): para resolver un pronóstico, CADA serie (proxy, referencia y cada miembro de la
  # CESTA) necesita un dato posterior al de la emisión y no más antiguo, a la fecha de resolución, que la antigüedad de PS2
  # de su horizonte (`ps2_antiguedad_maxima_dias`, Anexo A; H1 en sesiones). Si no, se espera y, pasado el plazo anterior,
  # NO_RESOLUBLE. Sin número nuevo: antes, un 7 común en el código (y en la r03, una clave con ese 7)
  llm_informe_aprendizaje: true
  # T-53
  alfa_holm: 0.10                 # Anexo A, certificado de horizonte (R13): corrección de Holm escalonada; α coherente con el IC 90 %
  ece_revocacion: 0.12            # [PROPUESTO] INC-T53-03 hasta T-57: revocación de un certificado por calibración; NO figura en el Anexo A
  # Anexo A, degradación automática de H5 (12.2, P-42). [PROPUESTO] INC-T53-04 hasta T-57: «Sí → Limitado» se aplica sola
  # y en el mismo ciclo (T-65, H-13); «Limitado → No» queda como propuesta de tipo 3 (R23, la regla más restrictiva)
  degradacion_h5_tasa_min: 0.50
  degradacion_h5_min_hitos: 20
  # Recalibración de los pesos de RK (Anexo A, P-11): paso por propuesta y bandas ±0,05 por trimestre y ±0,15 en total
  # (T-65, CS-10 de T-53). `dif_ic_min`: diferencia mínima de capacidad ordenadora (IC de Spearman) entre A y E para
  # proponer un ajuste, y `meses_sombra`: duración de la sombra; ninguno figura en el Anexo A ([PROPUESTO], técnico)
  recalibracion_rk: {paso: 0.05, banda_trimestral: 0.05, banda_total: 0.15, dif_ic_min: 0.10, meses_sombra: 3}
  # T-66 · PA-03, muestra efectiva: los certificados exigen n_eff ≥ min_certificar (efecto de diseño de Kish por
  # conglomerados de fecha de resolución; si falta, de emisión) y el IC del BSS sale de un bootstrap por fechas
  min_conglomerados_bootstrap: 10 # fechas distintas mínimas para dar IC del BSS por conglomerados; con menos, sin IC (no certifica)

# T-66 · PA-10 · [PROPUESTO] hasta T-57. Pregunta del cuestionario: «¿Ajustes automáticos solo prudentes?»
# true = el aprendizaje automático solo endurece: degradar H5 y revocar certificados siguen siendo automáticos; un
# certificado nuevo (habilita probabilidades numéricas) nace PROPUESTO hasta que el operador lo aprueba por CT-04
# (aprobar_certificados), y la recalibración de pesos de RK es siempre una propuesta (aplicado_en_produccion: false).
# false = comportamiento anterior (certificado VIGENTE al emitirse; la recalibración sigue evaluacion.aplicar_recalibracion).
aprendizaje:
  solo_endurecer: true

# T-53 · Bandas verbales y probabilidad interna (Anexo A, «Calibrable»); los huecos van a la banda más cercana a 50 %
bandas_verbales:
  - {codigo: MUY_PROBABLE, texto: muy probable, min: 0.80, max: 0.95, prob_interna: 0.85}
  - {codigo: MAS_PROBABLE_QUE_NO, texto: más probable que no, min: 0.60, max: 0.75, prob_interna: 0.65}
  - {codigo: INCIERTO, texto: incierto, min: 0.45, max: 0.55, prob_interna: 0.50}
  - {codigo: POCO_PROBABLE, texto: poco probable, min: 0.25, max: 0.40, prob_interna: 0.35}
  - {codigo: MUY_POCO_PROBABLE, texto: muy poco probable, min: 0.05, max: 0.20, prob_interna: 0.15}

# Paralelismo de agentes sin estado (R25)
paralelismo:
  hilos_analistas: 4
  umbral_cola: 3

backtest:
  frecuencia: semanal          # semanal | quincenal | mensual | diaria
  dia_semana: 4                # 0 = lunes … 4 = viernes (fecha as_of de cada ciclo)
  resolver_al_final: true      # tras el último ciclo, resolver con los datos disponibles
  # Fecha de corte de conocimiento del modelo (valor orientativo: compruébelo en la
  # documentación de Anthropic). Un periodo anterior genera advertencia de fuga por conocimiento.
  fecha_corte_modelo: "2026-06-30"
  # [PROPUESTO] PA-09 (T-66): auto = se anonimiza el backtest con un modelo real; con el simulado no hace falta.
  # Los pronósticos de un backtest con modelo real anterior a fecha_corte_modelo llevan contaminacion_posible y no
  # cuentan para certificados ni aprendizaje. Técnico, sin pregunta.
  anonimizar: auto

# T-65 (CS-11 de T-53) · Parámetros de HT-03 (puntuaciones, elegibilidad y selección; Documento 0, Anexo A y tablas 4.4 del
# esquema F10: P-09 a P-12). Antes solo se podían cambiar con la clave oculta `_parametros_ht03`. Son los mismos valores que
# `herramientas/referencia/ht03_puntuaciones.py` (corpus): una prueba exige que coincidan. Los cambios en producción los
# hace AG-20 en F10 (P-09, P-11), no este archivo.
parametros_ht03:
  pesos:
    T: {magnitud: 20, alcance: 15, velocidad: 15, duracion: 10, difusion: 10, posicion_cadena_valor: 10, capacidad_transformadora: 10, claridad_causal: 10}
    E: {calidad_raices: 25, cobertura_variables: 15, calidad_metodologica: 15, trazabilidad: 15, actualidad: 10, discrepancias_resueltas: 10, objeciones_respondidas: 10}
    M: {adopcion: 20, escalado: 15, indicadores_disponibles: 15, persistencia: 15, estabilidad_impulsores: 15, hitos_claros: 20}
    P: {T: 40, novedad: 20, incertidumbre_reducible: 20, coste_eficiencia: 20}
    A: {asimetria: 30, valoracion: 25, catalizadores: 15, momento: 15, invertibilidad: 15}
  pesos_rk: {A: 0.45, E: 0.35, T: 0.20}
  umbrales: {E: 60, A: 55, T: 50, A_si_T_NA: 65, GC2_E: 50}
  banda_marginal: 5
  cambio_material: 15
  tope_valoracion_saturacion: 40
  max_na_ne: 2
  max_opciones_por_clase: 3
  # [PROPUESTO] INC-T53-01 hasta T-57: con tres opciones del mismo clúster y ninguna alternativa a ≤ 10 puntos de RK, HT-03
  # publica las tres con la concentración declarada. Pregunta (T-57): «Si las tres mejores ideas son en el fondo la misma
  # apuesta, ¿se publican igual (avisando) o se deja un hueco?»
  max_por_cluster: 2
  diversidad_margen_rk: 10
  continuidad_margen_rk: 10
  empate_rk: 2
