[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloque_b"
version = "1.0.0"
description = "Ejecutor programático del Bloque B (Robot Investor) para pruebas y backtesting de rankings"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0", "jsonschema>=4.18", "numpy>=1.26", "pandas>=2.1", "PyYAML>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2"]
pruebas = ["pytest>=8"]

[project.scripts]
bloque-b = "bloque_b.cli:main"

[tool.setuptools]
packages = ["bloque_b", "bloque_b.herramientas", "bloque_b.herramientas.referencia"]

[tool.setuptools.package-data]
bloque_b = []

[tool.pytest.ini_options]
testpaths = ["tests"]
